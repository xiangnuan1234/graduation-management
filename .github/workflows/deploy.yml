name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    name: Deploy Backend Workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Workers
        run: |
          cd backend-workers
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.test }}
          CLOUDFLARE_ACCOUNT_ID: 694b74c6d5ec82483435f345f50e6af6

  deploy-pages:
    runs-on: ubuntu-latest
    name: Deploy Frontend Pages
    needs: deploy-workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Pages
        run: |
          cd frontend
          npm install
          npm run build
          # Try to create project if it doesn't exist
          npx wrangler pages project create graduation-management --production-branch=master || true
          npx wrangler pages deploy dist --project-name=graduation-management --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.test }}
          CLOUDFLARE_ACCOUNT_ID: 694b74c6d5ec82483435f345f50e6af6
