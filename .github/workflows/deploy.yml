name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    name: Deploy Backend Workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend-workers/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd backend-workers
          npm install
      
      - name: Deploy to Cloudflare Workers
        run: |
          cd backend-workers
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.test }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    runs-on: ubuntu-latest
    name: Deploy Frontend Pages
    needs: deploy-workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
      
      - name: Deploy to Cloudflare Pages
        run: |
          cd frontend
          # Try to create project if it doesn't exist
          npx wrangler pages project create graduation-management --production-branch=master || true
          npx wrangler pages deploy dist --project-name=graduation-management --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.test }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
