name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    name: Deploy Backend Workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend-workers/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd backend-workers
          npm install
      
      - name: Update Wrangler to Latest
        run: |
          cd backend-workers
          npm install --save-dev wrangler@latest
      
      - name: Deploy to Cloudflare Workers
        run: |
          cd backend-workers
          export CLOUDFLARE_API_TOKEN="${{ secrets.test }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          npx wrangler deploy

  deploy-pages:
    runs-on: ubuntu-latest
    name: Deploy Frontend Pages
    needs: deploy-workers
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Install Wrangler
        run: |
          cd frontend
          npm install --save-dev wrangler@latest
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
      
      - name: Deploy to Cloudflare Pages
        run: |
          cd frontend
          export CLOUDFLARE_API_TOKEN="${{ secrets.test }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          npx wrangler pages deploy dist --project-name=graduation-management --branch=master --commit-dirty=true
